<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project to Portfolio · Your project brief</title>
<style>
:root{color-scheme:light;--paper:#f7f6fc;--ink:#272333;--muted:#6d667a;--line:#e3deed;--accent:#6855e2;--soft:#eeebfc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 15px;min-height:44px}button.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b2a5ff;outline-offset:2px}button[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:var(--accent)}header{position:sticky;top:0;z-index:3;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topbar{max-width:1400px;margin:auto;padding:14px 28px;display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.5px}.brand svg{width:38px;height:38px}.tools{display:flex;gap:8px;flex-wrap:wrap}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:235px 1fr;gap:42px;padding:42px 28px 130px}aside{position:sticky;top:100px;align-self:start}aside small{color:var(--muted);display:block;margin-bottom:18px}nav a{display:block;padding:12px 14px;margin:4px 0;text-decoration:none;color:var(--muted);border-radius:10px;font-size:14px}nav a:hover{background:var(--soft);color:var(--ink)}.local-note{border-top:1px solid var(--line);padding-top:20px;font-size:13px;color:var(--muted);margin-top:22px}.intro{max-width:820px;margin-bottom:36px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase}h1{font-size:clamp(30px,4vw,46px);line-height:1.1;letter-spacing:-1.8px;margin:12px 0 18px}.intro p{color:var(--muted);max-width:720px}.section{scroll-margin-top:105px;margin-bottom:30px}.section-head{margin-bottom:20px}.section-head h2{font-size:22px;letter-spacing:-.6px;margin:0 0 8px}.section-head p{color:var(--muted);font-size:14px;margin:0}.field{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}.field-heading{display:flex;justify-content:space-between;align-items:start;gap:20px}.field label{font-weight:650;font-size:16px;display:block}.secondary{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:4px}.description{color:var(--muted);font-size:13px;margin:10px 0 16px}.question-number{color:var(--accent);font-size:11px;letter-spacing:1px;margin-right:8px}.optional{color:var(--muted);font-size:11px;white-space:nowrap}.answer{display:block;width:100%;background:#fcfbff;border:1px solid var(--line);border-radius:9px;padding:12px 14px;color:var(--ink);resize:vertical;min-height:48px}textarea.answer{min-height:102px}.field-bottom{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}.field-bottom label{font-size:11px;color:var(--muted);font-weight:500}.state{min-height:40px;padding:6px 10px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:white;font-size:12px;color:var(--muted)}details{font-size:12px;color:var(--muted)}details summary{cursor:pointer;padding:9px 0}.note{margin-top:8px;font-size:13px;min-height:72px}.ai-note{padding:12px 16px;border-radius:10px;background:var(--soft);font-size:13px;margin-bottom:15px}.footer{position:fixed;bottom:0;left:0;right:0;z-index:4;background:white;border-top:1px solid var(--line)}.footer-inner{max-width:1400px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:22px}.progress-info{font-size:13px;color:var(--muted)}.progress-info strong{display:block;color:var(--ink);font-size:14px}.track{width:min(290px,44vw);height:5px;background:var(--line);border-radius:8px;margin-top:7px}.track span{display:block;height:100%;background:var(--accent);border-radius:8px}.status{font-size:12px;min-height:18px;color:var(--muted);margin-top:5px}.error{color:#a72c46}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:28px 18px 155px;gap:20px}aside{position:static}aside small,.local-note{display:none}nav{display:flex;gap:6px;overflow-x:auto}nav a{white-space:nowrap;font-size:12px;padding:8px 10px}.topbar{padding:12px 18px}.brand{font-size:14px}.tools button{padding:8px 10px;font-size:12px}.footer-inner{padding:14px 18px}.field{padding:18px}.field-heading{gap:12px}}@media(max-width:520px){.topbar{align-items:start;flex-direction:column;gap:9px}.tools{width:100%}.section{scroll-margin-top:150px}.footer-inner{align-items:stretch;flex-direction:column;gap:10px}.footer .primary{width:100%}.track{width:100%}.layout{padding-bottom:190px}.field-heading{flex-direction:column;gap:4px}.brand svg{width:30px;height:30px}.intro{margin-bottom:26px}}
</style>
<header><div class="topbar"><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#6855e2"/><path d="M13 14h16v36H13zM35 14h16v36H35z" fill="#fff"/><path d="M24 27h17m-6-6 6 6-6 6" stroke="#e07a46" stroke-width="4" fill="none"/></svg>Project to Portfolio</div><div class="tools"><button id="english" aria-pressed="true">English</button><button id="chinese" aria-pressed="false">中文</button><button id="import-button">Import answers</button><input id="import-file" class="hidden" type="file" accept="application/json,.json"></div></div></header>
<div class="layout"><aside><small id="project-caption"></small><nav id="nav"></nav><p class="local-note" id="local-note"></p></aside><main><div class="intro"><div class="eyebrow" id="eyebrow"></div><h1 id="heading"></h1><p id="introduction"></p></div><div id="sections"></div></main></div>
<footer class="footer"><div class="footer-inner"><div class="progress-info"><strong id="progress-label"></strong><div class="track"><span id="progress-bar"></span></div><div class="status" role="status" aria-live="polite" id="status"></div></div><button class="primary" id="export-button">Export answers</button></div></footer>
<script id="question-schema" type="application/json">__QUESTIONS_JSON__</script>
<script id="project-data" type="application/json">__PROJECT_JSON__</script>
<script>
"use strict";
const schema=JSON.parse(document.getElementById('question-schema').textContent);
const seed=JSON.parse(document.getElementById('project-data').textContent);
const all=schema.sections.flatMap(section=>section.questions);
const known=new Map(all.map(question=>[question.id,question]));
const states=['confirmed','pending official verification','user-authorized TBD','N/A','unresolved'];
const stateLabels={en:{confirmed:'Confirmed','pending official verification':'Needs official verification','user-authorized TBD':'TBD — my choice','N/A':'Not applicable',unresolved:'Needs an answer'},zh:{confirmed:'已确认','pending official verification':'待官方核实','user-authorized TBD':'我选择暂定','N/A':'不适用',unresolved:'待回答'}};
const text={en:{eyebrow:'Your project, in your words',heading:'Start with what you made.',introduction:'Your assistant will turn this brief into a portfolio. Use what you already know, keep uncertain facts honest, and export your answers back to your chat. Nothing is sent from this form.',import:'Import answers',export:'Export answers',notes:'Notes or context',state:'Answer status',local:'This form works offline. Answers are saved only in this browser tab. Export JSON before closing it; your assistant can use that file in your project workspace.',saved:'Saved in this tab. Export JSON for a durable copy.',unsaved:'Tab storage unavailable. Export JSON to keep your answers.',optional:'Optional until Figma conversion',ai:'These questions concern AI/ML used in the original project, not the assistant preparing your portfolio.',exported:'Answers exported. Give the JSON file to your assistant.',invalid:'Please correct invalid confirmed answers before exporting.',imported:'Selected answers imported.'},zh:{eyebrow:'用你的话，讲述你的项目',heading:'从你真实完成的作品开始。',introduction:'你的助手会将这份项目简报转化为作品集。填写已有信息，如实保留未知事实，再将答案导出到对话中。表单不会向外发送数据。',import:'导入答案',export:'导出答案',notes:'备注或补充背景',state:'答案状态',local:'表单可离线使用，答案仅保存在当前浏览器标签页。关闭前请导出 JSON；助手可将所选文件保存到你的项目工作区。',saved:'已保存在当前标签页。请导出 JSON 以长期保存。',unsaved:'标签页存储不可用，请导出 JSON 保存答案。',optional:'在 Figma 转换前可暂不填写',ai:'这些问题针对原项目中使用的 AI/机器学习，不是用于制作作品集的助手。',exported:'答案已导出。请将 JSON 文件交给你的助手。',invalid:'导出前请修正无效的已确认答案。',imported:'已导入所选答案。'}};
let project=structuredClone(seed),storageOK=true;
const storageKey='project-to-portfolio:'+seed.workspaceId;
try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(saved&&saved.workspaceId===seed.workspaceId&&saved.intakeRevision===seed.intakeRevision&&saved.projectSlug===seed.projectSlug){validate(saved);project=saved}}catch(error){storageOK=false}
function language(){return project.language==='zh'?'zh':'en'}
function t(key){return text[language()][key]}
function node(tag,props={},children=[]){const element=document.createElement(tag);for(const[key,value]of Object.entries(props)){if(key==='text')element.textContent=value;else if(key==='class')element.className=value;else element.setAttribute(key,value)}for(const child of children)element.append(child);return element}
function validField(q,f){if(!f||!states.includes(f.state)||typeof f.notes!=='string'||(!['string','number'].includes(typeof f.value)))return false;if(f.state==='N/A'&&!q.allowNA)return false;if(f.state==='pending official verification'&&!q.externallyVerifiable)return false;if(f.state==='confirmed'){if(f.value===''||String(f.value).trim()==='')return false;if(q.kind==='number'&&(!Number.isInteger(f.value)||f.value<q.min||f.value>q.max))return false;if(q.kind==='select'&&!q.options.includes(f.value))return false}return q.kind==='number'||typeof f.value==='string'}
function validate(data){if(!data||data.schemaVersion!==1||data.projectSlug!==seed.projectSlug||(data.workspaceId&&data.workspaceId!==seed.workspaceId)||data.fields===null||typeof data.fields!=='object'||Array.isArray(data.fields))throw Error('Choose an intake export from this project.');const allowed=['schemaVersion','projectSlug','workspaceId','intakeRevision','language','fields','createdAt','updatedAt'];if(Object.keys(data).some(key=>!allowed.includes(key)))throw Error('Unsupported intake data.');if(data.intakeRevision!==undefined&&data.intakeRevision!==seed.intakeRevision)throw Error('The export belongs to an older project revision.');for(const[key,f]of Object.entries(data.fields)){if(!known.has(key)||!validField(known.get(key),f))throw Error('Invalid answer: '+key)}if(data.language!==undefined&&!['en','zh'].includes(data.language))throw Error('Unknown language.');return data}
function save(message){try{sessionStorage.setItem(storageKey,JSON.stringify(project));storageOK=true}catch(error){storageOK=false}status(message||t(storageOK?'saved':'unsaved'));updateProgress()}
function status(message,error=false){const display=document.getElementById('status');display.textContent=message;display.classList.toggle('error',error)}
function aiActive(){const f=project.fields['ai.used'];return f.state==='confirmed'&&f.value==='Yes'}
function updateProgress(){const active=all.filter(q=>q.requiredFor!=='preflight'&&(!q.conditionalOnAI||aiActive()));const complete=active.filter(q=>{const f=project.fields[q.id];return validField(q,f)&&(q.requiresConfirmed?f.state==='confirmed':['confirmed','N/A','user-authorized TBD'].includes(f.state))}).length;document.getElementById('progress-label').textContent=language()==='zh'?`${complete} / ${active.length} 项已解决`:`${complete} of ${active.length} answers resolved`;document.getElementById('progress-bar').style.width=`${complete/active.length*100}%`;document.querySelectorAll('[data-conditional]').forEach(element=>element.classList.toggle('hidden',!aiActive()))}
function render(){const lang=language(),other=lang==='en'?'zh':'en';document.documentElement.lang=lang;document.getElementById('english').setAttribute('aria-pressed',lang==='en');document.getElementById('chinese').setAttribute('aria-pressed',lang==='zh');for(const[id,key]of [['eyebrow','eyebrow'],['heading','heading'],['introduction','introduction'],['local-note','local'],['import-button','import'],['export-button','export']])document.getElementById(id).textContent=t(key);document.getElementById('project-caption').textContent=seed.projectSlug;const nav=document.getElementById('nav'),sections=document.getElementById('sections');nav.replaceChildren();sections.replaceChildren();for(const section of schema.sections){const title=lang==='zh'?section.titleZh:section.title;nav.append(node('a',{href:'#'+section.id,text:title}));const sectionNode=node('section',{id:section.id,class:'section'},[node('div',{class:'section-head'},[node('h2',{text:title}),node('p',{text:lang==='zh'?section.descriptionZh:section.description})])]);if(section.id==='technology-ai')sectionNode.append(node('p',{class:'ai-note',text:t('ai')}));for(const q of section.questions){const f=project.fields[q.id],field=node('div',{class:'field','data-field':q.id});if(q.conditionalOnAI)field.setAttribute('data-conditional','true');const label=node('label',{for:'q-'+q.id},[node('span',{class:'question-number',text:q.number}),document.createTextNode(lang==='zh'?q.labelZh:q.label),node('span',{class:'secondary',text:other==='zh'?q.labelZh:q.label})]);const heading=node('div',{class:'field-heading'},[label]);if(q.requiredFor==='preflight')heading.append(node('span',{class:'optional',text:t('optional')}));field.append(heading,node('p',{class:'description',text:lang==='zh'?q.descriptionZh:q.description}));let input;if(q.kind==='select'){input=node('select',{class:'answer',id:'q-'+q.id},[node('option',{value:'',text:lang==='zh'?'请选择':'Choose an answer'})]);for(const option of q.options)input.append(node('option',{value:option,text:lang==='zh'?(q.optionLabelsZh?.[option]||option):option}))}else if(q.kind==='textarea')input=node('textarea',{class:'answer',id:'q-'+q.id,rows:'3'});else{input=node('input',{class:'answer',id:'q-'+q.id,type:q.kind==='number'?'number':'text'});if(q.kind==='number'){input.min=q.min;input.max=q.max;input.step='1'}}input.value=f.value;input.addEventListener('input',()=>{const raw=input.value;f.value=q.kind==='number'&&raw!==''?Number(raw):raw;if(raw!==''&&f.state==='unresolved')f.state='confirmed';if(raw===''&&f.state==='confirmed')f.state='unresolved';stateSelect.value=f.state;save()});field.append(input);const stateSelect=node('select',{class:'state',id:'state-'+q.id,'aria-label':t('state')+' · '+(lang==='zh'?q.labelZh:q.label)});for(const state of states){if(state==='N/A'&&!q.allowNA)continue;if(state==='pending official verification'&&!q.externallyVerifiable)continue;stateSelect.append(node('option',{value:state,text:stateLabels[lang][state]}))}stateSelect.value=f.state;stateSelect.addEventListener('change',()=>{f.state=stateSelect.value;save()});const notes=node('textarea',{class:'answer note',id:'notes-'+q.id,'aria-label':t('notes')+' · '+(lang==='zh'?q.labelZh:q.label)});notes.value=f.notes;notes.addEventListener('input',()=>{f.notes=notes.value;save()});const details=node('details',{},[node('summary',{text:t('notes')}),notes]);const bottom=node('div',{class:'field-bottom'},[stateSelect,details]);field.append(bottom);sectionNode.append(field)}sections.append(sectionNode)}updateProgress();status(t(storageOK?'saved':'unsaved'))}
document.getElementById('english').addEventListener('click',()=>{project.language='en';render();save()});document.getElementById('chinese').addEventListener('click',()=>{project.language='zh';render();save()});document.getElementById('import-button').addEventListener('click',()=>document.getElementById('import-file').click());document.getElementById('import-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{const selected=validate(JSON.parse(await file.text()));Object.assign(project.fields,selected.fields);if(selected.language)project.language=selected.language;render();save(t('imported'))}catch(error){status(error.message,true)}event.target.value=''});document.getElementById('export-button').addEventListener('click',()=>{try{validate(project)}catch(error){status(t('invalid')+' '+error.message,true);return}const blob=new Blob([JSON.stringify(project,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),link=node('a',{href:url,download:project.projectSlug+'-intake.json'});document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);save(t('exported'))});render();save();
</script>
</html>
